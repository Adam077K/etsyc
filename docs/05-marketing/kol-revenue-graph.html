<title>KOL — Revenue vs. Adoption graph</title>
<style>
  :root{--paper:#ECE8E1;--ink:#17130F;--ink2:#4A423A;--meta:#877E71;--terra:#BF5630;--line:#D8D1C4;
    --grotesk:"Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#14110E;display:grid;place-items:center;font-family:var(--grotesk)}
  .card{width:min(96vw,calc(94vh*16/9));aspect-ratio:16/9;background:var(--paper);border-radius:6px;
    box-shadow:0 30px 90px rgba(0,0,0,.5);overflow:hidden;
    background-image:radial-gradient(rgba(120,110,95,.05) 1px,transparent 1px);background-size:4px 4px}
  svg{width:100%;height:100%;display:block}
  .t{font-weight:800}
  text{font-family:var(--grotesk)}
</style>
<div class="card">
<svg viewBox="0 0 1000 562" role="img" aria-label="KOL revenue scales with adoption, from 18 million to 90 million dollars">
  <!-- title -->
  <text x="60" y="52" font-size="30" font-weight="800" fill="#17130F" letter-spacing="-.5">The path from $18M to $90M.</text>
  <text x="60" y="78" font-size="15" fill="#877E71">KOL keeps 10% of the incremental GMS it creates — pilot to full story-rich adoption.</text>

  <!-- gridlines + y labels -->
  <g stroke="#D8D1C4" stroke-width="1">
    <line x1="110" y1="90"  x2="940" y2="90"/>
    <line x1="110" y1="166.4" x2="940" y2="166.4"/>
    <line x1="110" y1="242.8" x2="940" y2="242.8"/>
    <line x1="110" y1="319.2" x2="940" y2="319.2"/>
    <line x1="110" y1="395.6" x2="940" y2="395.6"/>
  </g>
  <g font-size="14" fill="#877E71" text-anchor="end" font-variant-numeric="tabular-nums">
    <text x="98" y="95">$90M</text>
    <text x="98" y="171.4">$72M</text>
    <text x="98" y="247.8">$54M</text>
    <text x="98" y="324.2">$36M</text>
    <text x="98" y="400.6">$18M</text>
    <text x="98" y="477">$0</text>
  </g>

  <!-- axes -->
  <line x1="110" y1="90" x2="110" y2="472" stroke="#17130F" stroke-width="2"/>
  <line x1="110" y1="472" x2="940" y2="472" stroke="#17130F" stroke-width="2"/>

  <!-- x labels -->
  <g font-size="14" fill="#877E71" text-anchor="middle" font-variant-numeric="tabular-nums">
    <text x="110" y="497">0</text>
    <text x="276" y="497">20%</text>
    <text x="442" y="497">40%</text>
    <text x="608" y="497">60%</text>
    <text x="774" y="497">80%</text>
    <text x="940" y="497">100%</text>
  </g>

  <!-- area + line (linear from origin to full adoption) -->
  <path d="M110,472 L940,90 L940,472 Z" fill="#BF5630" fill-opacity="0.12"/>
  <line x1="110" y1="472" x2="940" y2="90" stroke="#BF5630" stroke-width="3.5" stroke-linecap="round"/>

  <!-- pilot guide -->
  <line x1="276" y1="395.6" x2="276" y2="472" stroke="#BF5630" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.5"/>

  <!-- pilot marker -->
  <circle cx="276" cy="395.6" r="8" fill="#BF5630"/>
  <circle cx="276" cy="395.6" r="15" fill="none" stroke="#BF5630" stroke-opacity="0.35" stroke-width="2"/>
  <text x="300" y="360" font-size="26" font-weight="800" fill="#BF5630">~$18M</text>
  <text x="300" y="380" font-size="13.5" fill="#877E71">Pilot · 20% adoption</text>

  <!-- full-adoption marker -->
  <circle cx="940" cy="90" r="9" fill="#BF5630" stroke="#ECE8E1" stroke-width="2"/>
  <text x="922" y="128" font-size="30" font-weight="800" fill="#BF5630" text-anchor="end">~$90M</text>
  <text x="922" y="150" font-size="13.5" fill="#877E71" text-anchor="end">Full story-rich adoption</text>

  <!-- axis titles -->
  <text x="525" y="532" font-size="14" fill="#877E71" text-anchor="middle" font-weight="600">Adoption — share of story-rich categories on KOL</text>
  <text x="34" y="281" font-size="14" fill="#877E71" text-anchor="middle" font-weight="600" transform="rotate(-90 34 281)">KOL ARR</text>

  <!-- footnote -->
  <text x="60" y="550" font-size="11.5" fill="#877E71">Linear in adoption · +15% lift &amp; 10% take = our model · $11.9B Etsy GMS sourced (10-K FY2025).</text>
</svg>
</div>
